# Replace the placeholder with the published Project-Guard commit SHA. Do not use a moving tag.
name: Dependency context

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  checks: read
  statuses: read

jobs:
  context:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    uses: Majkey25/Project-Guard/.github/workflows/dependency-context.yml@9a09c0a0d9a6977215f452fc7f73c53660ed9c0d
    # Root owns branch rules and deployment configuration. Do not pass secrets.
